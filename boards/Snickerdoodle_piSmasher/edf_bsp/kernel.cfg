# snickerdoodle black + piSmasher

# zocl (XRT) needs DRM; PL programming via the FPGA manager and overlays
CONFIG_DRM=y
CONFIG_DRM_GEM_DMA_HELPER=y
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_FPGA_BRIDGE=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y
CONFIG_OF_OVERLAY=y
CONFIG_OF_CONFIGFS=y
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# piSmasher Ethernet: GEMs through PL gmii_to_rgmii bridges
CONFIG_MACB=y
CONFIG_XILINX_GMII2RGMII=y
CONFIG_MARVELL_PHY=y
CONFIG_REALTEK_PHY=y
CONFIG_MICREL_PHY=y

# USB host through the USB2514B hub
CONFIG_USB_CHIPIDEA=y
CONFIG_USB_CHIPIDEA_HOST=y
CONFIG_USB_ULPI=y
CONFIG_NOP_USB_XCEIV=y
CONFIG_USB_ONBOARD_DEV=y

# TI WL1837 WiFi on SDIO1 (firmware from linux-firmware)
CONFIG_WLCORE_SDIO=m
CONFIG_WL18XX=m
CONFIG_BT=m
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_LL=y

# Platform microcontroller interface (spi-ctrl)
CONFIG_SPI_CADENCE=y
CONFIG_SPI_SPIDEV=y
CONFIG_SPI_ZYNQ_QSPI=y
CONFIG_MTD_SPI_NOR=y

# Ubuntu 24.04's linux-firmware is zstd-compressed (wl18xx-fw-4.bin.zst)
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_XZ=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
